name: Update Sponsors

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC

permissions:
  contents: write

jobs:
  update-sponsors:
    # Only run in the upstream repository. Forks do not have the PAT
    # secret, so the scheduled run would fail there every day.
    if: github.repository == 'ly4k/Certipy'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-sponsors-readme-action@v1
        with:
          token: ${{ secrets.PAT }}
      - uses: stefanzweifel/git-auto-commit-action@v5